name: Publish Hugo website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.159.2"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download website and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${0.159.2}/hugo_extended_${0.159.2}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" \
            -C "${RUNNER_TEMP}/hugo-bin"
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Build website
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
