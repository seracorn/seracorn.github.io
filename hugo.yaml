baseURL: "https://seracorn.github.io/"
title: "我的个人网站"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  author: "你的名字"
  description: "个人履历、项目成果与学习笔记"
  defaultTheme: "auto"
  mainSections:
    - posts
    - notes

  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true

  profileMode:
    enabled: true
    title: "这是玉米的个人blog"
    subtitle: "在这里记录学习、项目与成长"
    imageUrl: "images/avatar.jpg"
    imageTitle: "我的头像"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: "个人履历"
        url: "about/"
      - name: "学习笔记"
        url: "notes/"

menu:
  main:
    - name: "关于我"
      url: "/about/"
      weight: 10
    - name: "笔记"
      url: "/notes/"
      weight: 20
    - name: "随笔"
      url: "/posts/"
      weight: 30
    - name: "归档"
      url: "/archives/"
      weight: 40
    - name: "搜索"
      url: "/search/"
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

